{% extends "admin/base_site.html" %}

{% block content %}
<h1>Upload Organizer Workbook or Manifest</h1>
<p>You can upload either an <strong>Organizer PDF</strong> (to extract and process) or a <strong>Manifest JSON</strong> (to directly create checklist items).</p>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Upload and Process</button>
</form>
{% endblock %}
