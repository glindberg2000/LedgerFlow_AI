{% extends "admin/base_site.html" %}
{% load static %}

{% block content %}
  <h1>Attach Manifest to Organizer</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Attach Manifest" class="default">
    <a href="{{ request.META.HTTP_REFERER|default:'/' }}">Cancel</a>
  </form>
{% endblock %}
